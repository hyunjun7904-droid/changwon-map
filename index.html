<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>창원 부동산 영업지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#2563eb;
          --s-none:#8e8e93; --s-done:#16a34a; --s-hot:#ea580c; --s-again:#2563eb; --s-no:#dc2626; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:var(--fg); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:380px; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #map { flex:1; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0 0 10px; }
  .row { display:flex; gap:6px; margin-bottom:6px; }
  select,input,button,textarea { font:inherit; font-size:14px; }
  select,input { flex:1; padding:7px 8px; border:1px solid var(--line); border-radius:8px; min-width:0; background:#fff; }
  .stats { font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .stats b { color:var(--fg); }
  #list { flex:1; overflow-y:auto; }
  .item { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
  .item:hover, .item.sel { background:#f2f6ff; }
  .dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none; }
  .nm { font-weight:600; font-size:14px; }
  .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  .memo { font-size:12px; color:#92400e; margin-top:3px; }
  .pop .nm { font-size:15px; }
  .pop a { color:var(--accent); text-decoration:none; }
  .btns { display:flex; gap:4px; flex-wrap:wrap; margin:8px 0 6px; }
  .btns button { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .btns button.on { color:#fff; border-color:transparent; }
  .pop textarea { width:100%; height:48px; border:1px solid var(--line); border-radius:6px; padding:5px; font-size:12px; }
  .links { display:flex; gap:10px; font-size:13px; margin-top:4px; }
  .rec { display:flex; gap:4px; margin-top:8px; }
  .rec input { padding:4px 6px; font-size:12px; border-radius:6px; }
  .rec input[type=date] { flex:none; width:128px; }
  .hint { font-size:11px; color:var(--muted); margin-top:4px; }
  .hist { margin:6px 0 8px; max-height:120px; overflow-y:auto; border-top:1px solid var(--line); }
  .hist div { display:flex; gap:6px; align-items:baseline; font-size:12px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .hist .d { font-variant-numeric:tabular-nums; color:var(--muted); flex:none; }
  .hist .s { font-weight:600; flex:none; }
  .hist .n { flex:1; }
  .hist button { border:none; background:none; color:var(--muted); cursor:pointer; padding:0 2px; }
  .last { font-size:12px; color:var(--s-done); margin-top:2px; }
  .tool { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
  .menu { position:relative; }
  .menu-pop { display:none; position:absolute; right:0; top:110%; background:#fff; border:1px solid var(--line); border-radius:10px;
              box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:2000; min-width:170px; overflow:hidden; }
  .menu-pop.open { display:block; }
  .menu-pop button, .menu-pop label { display:block; width:100%; text-align:left; padding:11px 14px; border:none; background:#fff; font-size:14px; cursor:pointer; }
  .menu-pop button:hover, .menu-pop label:hover { background:#f2f6ff; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1d1d1f; color:#fff; padding:9px 16px;
           border-radius:20px; font-size:13px; z-index:3000; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:760px) {
    html,body { height:100dvh; }
    #app { flex-direction:column; height:100dvh; }
    #side { width:100%; height:50%; border-right:none; border-top:1px solid var(--line); order:2; }
    #map { order:1; min-height:50%; }
    header { padding:8px 12px 6px; }
    h1 { display:none; }
    select,input,.tool { font-size:15px; padding:9px 8px; }
    .item { padding:12px 14px; }
    .btns button { padding:7px 11px; font-size:13px; }
    .rec input { font-size:14px; padding:7px; }
    .hist button { padding:2px 8px; font-size:16px; }
    .hint { display:none; }
    .hist { max-height:84px; }
    .pop textarea { height:36px; }
    .leaflet-popup-content { margin:10px 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>창원 성산구·의창구 부동산 영업지도</h1>
      <div class="row">
        <select id="dong"></select>
        <select id="status"></select>
      </div>
      <div class="row">
        <input id="q" placeholder="상호·주소·전화 검색">
        <button class="tool" id="near">가까운순</button>
        <div class="menu">
          <button class="tool" id="menuBtn" aria-label="메뉴">⋯</button>
          <div class="menu-pop" id="menuPop">
            <button id="export">엑셀(CSV) 내보내기</button>
            <button id="backup">기록 백업 저장</button>
            <label>기록 백업 불러오기<input type="file" id="restore" accept=".json,application/json" hidden></label>
          </div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </header>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</div>

const lastDate = d => (hist(d)[0] || {}).d || '';
const memo = d => (visits[d.id] && visits[d.id].m) || '';
const md = s => s.slice(5).replace('-', '/');

const map = L.map('map', { zoomControl: !matchMedia('(pointer: coarse)').matches }) // 터치 기기는 두 손가락 확대로 충분.setView([35.26, 128.66], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap',
}).addTo(map);

const markers = {};
data.forEach(d => {
  const m = L.circleMarker([d.y, d.x], { radius: 7, weight: 1.5, color: '#fff', fillOpacity: .9, fillColor: STATUS[st(d)].hex });
  m.bindPopup(() => popup(d), { minWidth: 260, maxWidth: 300, autoPanPadding: [8, 8] });
  m.on('popupopen', () => select(d.id, false));
  markers[d.id] = m;
});

// 필터 UI
const dongSel = document.getElementById('dong');
// 값: "구" 또는 "구|동"
const counts = {};
data.forEach(d => {
  counts[d.gu] = (counts[d.gu] || 0) + 1;
  counts[d.gu + '|' + d.dong] = (counts[d.gu + '|' + d.dong] || 0) + 1;
});
const gus = [...new Set(data.map(d => d.gu))].sort((a, b) => a.localeCompare(b, 'ko'));
dongSel.innerHTML = `<option value="">전체 (${data.length})</option>` + gus.map(g =>
  `<optgroup label="${g}"><option value="${g}">${g} 전체 (${counts[g]})</option>` +
  Object.keys(counts).filter(k => k.startsWith(g + '|')).sort((a, b) => a.localeCompare(b, 'ko'))
    .map(k => `<option value="${k}">${k.split('|')[1]} (${counts[k]})</option>`).join('') + '</optgroup>').join('');
const statusSel = document.getElementById('status');
statusSel.innerHTML = `<option value="">전체 상태</option>` + Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('') +
  `<option value="@today">오늘 방문한 곳</option><option value="@week">최근 7일 방문</option>`;
const q = document.getElementById('q');
[dongSel, statusSel].forEach(el => el.addEventListener('change', () => render(true)));
q.addEventListener('input', () => render(false));

let origin = null, selected = null;
document.getElementById('near').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    origin = [p.coords.latitude, p.coords.longitude];
    L.circleMarker(origin, { radius: 6, color: '#2563eb', fillColor: '#60a5fa', fillOpacity: 1 }).addTo(map);
    render(false);
  }, () => {});
});

function filtered() {
  const dg = dongSel.value, s = statusSel.value, k = q.value.trim().toLowerCase();
  const week = new Date(Date.now() - 6 * 864e5); week.setMinutes(week.getMinutes() - week.getTimezoneOffset());
  const since = s === '@today' ? today() : s === '@week' ? week.toISOString().slice(0, 10) : null;
  const okStatus = d => !s || (since ? lastDate(d) >= since : st(d) === s);
  let list = data.filter(d => (!dg || d.gu === dg || d.gu + '|' + d.dong === dg) && okStatus(d) &&
    (!k || (d.name + d.addr + d.jibun + d.phone + memo(d)).toLowerCase().includes(k)));
  if (origin) {
    const dist = d => (d.y - origin[0]) ** 2 + ((d.x - origin[1]) * Math.cos(origin[0] * Math.PI / 180)) ** 2;
    list.sort((a, b) => dist(a) - dist(b));
  }
  return list;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(fit) {
  const list = filtered();
  const ids = new Set(list.map(d => d.id));
  data.forEach(d => {
    const m = markers[d.id];
    m.setStyle({ fillColor: STATUS[st(d)].hex });
    if (ids.has(d.id)) { if (!map.hasLayer(m)) m.addTo(map); } else if (map.hasLayer(m)) m.remove();
  });
  document.getElementById('list').innerHTML = list.map(d => `
    <div class="item${d.id === selected ? ' sel' : ''}" data-id="${d.id}">
      <span class="dot" style="background:${STATUS[st(d)].color}"></span>
      <div><div class="nm">${esc(d.name)}</div>
        <div class="sub">${esc(d.gu)} ${esc(d.dong)} · ${d.phone ? esc(d.phone) : '전화번호 없음'}</div>
        <div class="sub">${esc(d.addr)}</div>
        ${lastDate(d) ? `<div class="last">최근 방문 ${lastDate(d)} · ${STATUS[st(d)].label} (총 ${hist(d).length}회)</div>` : ''}
        ${memo(d) ? `<div class="memo">📝 ${esc(memo(d))}</div>` : ''}</div>
    </div>`).join('') || '<div class="item sub">조건에 맞는 곳이 없습니다.</div>';
  const tally = {};
  list.forEach(d => tally[st(d)] = (tally[st(d)] || 0) + 1);
  const todayCnt = data.filter(d => lastDate(d) === today()).length;
  document.getElementById('stats').innerHTML = `<span><b>${list.length}</b>곳</span>` +
    Object.entries(STATUS).filter(([k]) => tally[k]).map(([k, v]) => `<span style="color:${v.color}">● ${v.label} ${tally[k]}</span>`).join('') +
    (todayCnt ? `<span>· 오늘 <b>${todayCnt}</b>곳 방문</span>` : '');
  if (fit && list.length) map.fitBounds(L.latLngBounds(list.map(d => [d.y, d.x])), { padding: [30, 30], maxZoom: 16 });
}

document.getElementById('list').addEventListener('click', e => {
  const el = e.target.closest('.item[data-id]');
  if (!el) return;
  const d = data.find(x => x.id === el.dataset.id);
  map.setView([d.y, d.x], Math.max(map.getZoom(), 16), { animate: false });
  markers[d.id].openPopup();
});

function select(id, scroll = true) {
  selected = id;
  document.querySelectorAll('.item.sel').forEach(el => el.classList.remove('sel'));
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if (el) { el.classList.add('sel'); el.scrollIntoView({ block: 'nearest' }); }
}

function popup(d) {
  const div = document.createElement('div');
  div.className = 'pop';
  const tel = d.phone ? `<a href="tel:${d.phone.replace(/[^0-9]/g, '')}">📞 ${esc(d.phone)}</a>` : '<span class="sub">전화번호 없음</span>';
  div.innerHTML = `
    <div class="nm">${esc(d.name)}</div>
    <div style="margin-top:4px">${tel}</div>
    <div class="sub">${esc(d.addr)}${d.addr !== d.jibun ? `<br>(${esc(d.jibun)})` : ''}</div>
    <div class="rec">
      <input type="date" value="${today()}">
      <input class="note" placeholder="이번 방문 메모 (선택)">
    </div>
    <div class="btns">${Object.entries(STATUS).filter(([k]) => k !== 'none').map(([k, v]) =>
      `<button data-s="${k}" style="border-color:${v.hex};color:${v.hex}">+ ${v.label}</button>`).join('')}</div>
    <div class="hint">날짜를 고르고 결과 버튼을 누르면 방문 이력에 추가됩니다.</div>
    <div class="hist"></div>
    <textarea placeholder="고정 메모 (소장님 성함, 특징 등)">${esc(memo(d))}</textarea>
    <div class="links">
      <a href="https://place.map.kakao.com/${d.id}" target="_blank" rel="noopener">카카오맵 상세</a>
      <a href="https://map.kakao.com/link/to/${encodeURIComponent(d.name)},${d.y},${d.x}" target="_blank" rel="noopener">길찾기</a>
    </div>`;
  const histEl = div.querySelector('.hist');
  const drawHist = () => {
    const h = hist(d);
    histEl.innerHTML = h.length ? h.map((e, i) => `<div>
        <span class="d">${e.d}</span><span class="s" style="color:${STATUS[e.s].hex}">${STATUS[e.s].label}</span>
        <span class="n">${esc(e.n || '')}</span><button title="삭제" data-del="${i}">×</button></div>`).join('')
      : '<div class="sub">아직 방문 이력이 없습니다.</div>';
  };
  drawHist();
  histEl.addEventListener('click', e => {
    const b = e.target.closest('button[data-del]');
    if (!b) return;
    const v = visits[d.id], i = v.h.indexOf(hist(d)[+b.dataset.del]);
    if (i >= 0) v.h.splice(i, 1);
    save(); drawHist(); render(false); select(d.id);
  });
  div.querySelectorAll('button[data-s]').forEach(b => b.addEventListener('click', () => {
    const dateEl = div.querySelector('input[type=date]'), noteEl = div.querySelector('.note');
    const v = visits[d.id] = visits[d.id] || { h: [] };
    v.h = v.h || [];
    v.h.push({ d: dateEl.value || today(), s: b.dataset.s, n: noteEl.value.trim() });
    noteEl.value = '';
    save(); drawHist(); render(false); select(d.id);
  }));
  div.querySelector('textarea').addEventListener('change', e => {
    visits[d.id] = { h: [], ...(visits[d.id] || {}), m: e.target.value };
    save(); render(false); select(d.id);
  });
  return div;
}

// 메뉴 · 백업/복원
const menuPop = document.getElementById('menuPop');
document.getElementById('menuBtn').addEventListener('click', e => { e.stopPropagation(); menuPop.classList.toggle('open'); });
document.addEventListener('click', e => { if (!e.target.closest('.menu')) menuPop.classList.remove('open'); });

const toastEl = Object.assign(document.createElement('div'), { className: 'toast' });
document.body.appendChild(toastEl);
const toast = msg => { toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2200); };

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

document.getElementById('backup').addEventListener('click', () => {
  download(`영업지도_백업_${today()}.json`, JSON.stringify({ app: 'changwon-visits', saved: today(), visits }), 'application/json');
  menuPop.classList.remove('open');
  toast('백업 파일을 저장했습니다 (다운로드 폴더)');
});

document.getElementById('restore').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  menuPop.classList.remove('open');
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'changwon-visits' || typeof j.visits !== 'object') throw new Error();
    // 병합: 같은 날짜·상태·메모 이력은 중복 추가하지 않음
    let added = 0;
    for (const [id, v] of Object.entries(j.visits)) {
      const cur = visits[id] = visits[id] || { h: [] };
      cur.h = cur.h || [];
      if (v.m && !cur.m) cur.m = v.m;
      for (const h of v.h || []) {
        if (!cur.h.some(x => x.d === h.d && x.s === h.s && (x.n || '') === (h.n || ''))) { cur.h.push(h); added++; }
      }
    }
    save(); render(false);
    toast(`백업을 불러왔습니다 (이력 ${added}건 추가)`);
  } catch (err) {
    toast('백업 파일을 읽지 못했습니다');
  }
});

document.getElementById('export').addEventListener('click', () => {
  menuPop.classList.remove('open');
  const qq = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [['구', '동', '상호', '전화번호', '도로명주소', '지번주소', '현재상태', '최근방문일', '방문횟수', '방문이력', '메모']];
  data.forEach(d => {
    const h = hist(d);
    rows.push([d.gu, d.dong, d.name, d.phone, d.addr, d.jibun, STATUS[st(d)].label, lastDate(d), h.length || '',
      h.map(e => `${e.d} ${STATUS[e.s].label}${e.n ? ` (${e.n})` : ''}`).join(' / '), memo(d)]);
  });
  download(`부동산_방문기록_${today()}.csv`, '﻿' + rows.map(r => r.map(qq).join(',')).join('\r\n'), 'text/csv');
  toast('엑셀 파일을 저장했습니다 (다운로드 폴더)');
});

render(true);

// 앱 설치·오프라인 지원 (https 또는 localhost에서만 동작)
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
// 기록이 브라우저 정리 대상에서 빠지도록 영구 저장 요청
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
